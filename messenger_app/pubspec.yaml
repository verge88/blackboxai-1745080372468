name: messenger_app
description: A full-featured messaging application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Networking
  http: ^0.13.5
  
  # State management
  provider: ^6.0.5
  
  # Firebase
  firebase_core: ^2.15.1
  firebase_auth: ^4.8.0
  cloud_firestore: ^4.9.1
  firebase_messaging: ^14.6.7
  firebase_storage: ^11.2.6
  
  # Local storage
  shared_preferences: ^2.1.1
  
  # UI enhancements
  cupertino_icons: ^1.0.5
  cached_network_image: ^3.2.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true